name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'ARCHITECTURE.md'
      - 'PROTOCOL.md'
      - '.github/workflows/docs.yml'
      - 'scripts/check-docs-links.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Audit documentation dependencies
        working-directory: docs
        run: npm audit

      - name: Build VitePress site
        working-directory: docs
        env:
          # Optional repository variables; unset values fall back to the
          # canonical repository configured in docs/.vitepress/config.ts.
          SIPBRIDGE_DOCS_REPOSITORY_URL: ${{ vars.SIPBRIDGE_DOCS_REPOSITORY_URL }}
          SIPBRIDGE_DOCS_SOURCE_URL: ${{ vars.SIPBRIDGE_DOCS_SOURCE_URL }}
        run: npm run docs:build

      - name: Check built links and anchors
        run: python3 scripts/check-docs-links.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
