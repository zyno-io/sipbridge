  <text x="80" y="268" font-family="SF Pro Display" font-weight="600" font-size="50" fill="#f5f5f7" letter-spacing="-0.5">SIP signaling that your application controls</text>
  <text x="80" y="322" font-family="SF Pro Text" font-size="27" fill="#a1a1aa">sipbridge runs SIP transactions, dialogs and timers.</text>
  <text x="80" y="358" font-family="SF Pro Text" font-size="27" fill="#a1a1aa">Your controller decides each call over a WebSocket.</text>

